<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whisper – gyva transkripcija</title>
<style>
body{font:17px system-ui;max-width:1300px;margin:35px auto;padding:16px;line-height:1.5}
button{padding:10px 18px;margin-right:8px;cursor:pointer}
pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
#partial{color:#777;font-style:italic}#status{font-size:14px;color:#555}
mark{background:#fff1a8;border-radius:3px;cursor:help}
.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
</style></head><body>
<h2>Gyva transkripcija – Ąžuolas</h2>
<p><button id="start">Pradėti</button><button id="stop" disabled>Sustabdyti</button><button id="clear">Išvalyti</button></p>
<p><label><input type="checkbox" id="spell" checked> Taisyti žodyne nerastus žodžius (LT-Checker)</label></p>
<p><label><input type="checkbox" id="punct"> Įjungti skyrybos atkūrimą (be žodžių taisymo)</label></p>
<p id="status">Neprisijungta</p>
<div class="columns">
<section><h3>Originali transkripcija</h3><pre id="raw"></pre><div id="partial"></div></section>
<section id="formattedColumn" hidden><h3>Su skyrybos ženklais</h3><pre id="formatted"></pre></section>
<section id="fixedColumn"><h3>Pataisyti žodžiai</h3><pre id="fixed"></pre></section>
</div>
<script>
const URL = 'ws://192.168.68.110:8001/ws/transcribe';
const start = document.getElementById('start');
const stop = document.getElementById('stop');
const status = document.getElementById('status');
const raw = document.getElementById('raw');
const partial = document.getElementById('partial');
const formatted = document.getElementById('formatted');
const punct = document.getElementById('punct');
const formattedColumn = document.getElementById('formattedColumn');
const fixed = document.getElementById('fixed');
const spell = document.getElementById('spell');
const fixedColumn = document.getElementById('fixedColumn');
let ws, stream, ctx, source, node, silent, stopping = false;
const records = new Map();

function renderPieces(text, pieces) {
  const frag = document.createDocumentFragment();
  for (const [part, original] of pieces || [[text, null]]) {
    if (original === null) { frag.append(part); continue; }
    const m = document.createElement('mark');
    m.textContent = part; m.title = 'Buvo: ' + original;
    frag.append(m);
  }
  return frag;
}
function renderInto(el, list, pick) {
  el.replaceChildren();
  list.forEach((r, i) => { if (i) el.append(' '); el.append(pick(r)); });
}
// Server order: raw -> punctuation (if on) -> spelling on the punctuated text
// (or on raw when punctuation is off). Columns show each stage as it arrives.
function render() {
  const list = [...records.values()];
  raw.textContent = list.map(r => r.raw).join(' ');
  formatted.textContent = list.map(r => r.punct || r.raw).join(' ');
  renderInto(fixed, list, r => renderPieces(r.fixed ?? (r.punct || r.raw), r.pieces));
}
// Autoscroll: follow the newest text only while the user is at the bottom.
function nearBottom() {
  const el = document.scrollingElement;
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}
function scrollToEnd() {
  const el = document.scrollingElement;
  el.scrollTop = el.scrollHeight;
}
function setSpelling(enabled) {
  fixedColumn.hidden = !enabled;
  if (ws?.readyState === WebSocket.OPEN)
    ws.send(enabled ? 'spelling_on' : 'spelling_off');
}
spell.onchange = () => setSpelling(spell.checked);
// Clears shown text; recording continues. Late punctuation for cleared
// segments is ignored because their records are gone.
document.getElementById('clear').onclick = () => {
  records.clear(); partial.textContent = ''; render();
};
function setPunctuation(enabled) {
  formattedColumn.hidden = !enabled;
  if (ws?.readyState === WebSocket.OPEN)
    ws.send(enabled ? 'punctuation_on' : 'punctuation_off');
}
punct.onchange = () => setPunctuation(punct.checked);
async function cleanup() {
  try { source?.disconnect(); node?.disconnect(); silent?.disconnect(); } catch {}
  stream?.getTracks().forEach(t => t.stop());
  if (ctx && ctx.state !== 'closed') await ctx.close();
  start.disabled = false; stop.disabled = true;
}
start.onclick = async () => {
  try {
    stopping = false;
    records.clear(); raw.textContent = ''; formatted.textContent = ''; fixed.textContent = '';
    partial.textContent = '';
    stream = await navigator.mediaDevices.getUserMedia({audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false
    }});
    ctx = new AudioContext();
    await ctx.audioWorklet.addModule('pcm-worklet.js');
    source = ctx.createMediaStreamSource(stream);
    node = new AudioWorkletNode(ctx, 'pcm16k');
    silent = ctx.createGain(); silent.gain.value = 0;
    source.connect(node).connect(silent).connect(ctx.destination);
    ws = new WebSocket(URL);
    ws.binaryType = 'arraybuffer';
    node.port.onmessage = ev => {
      if (ws.readyState === WebSocket.OPEN && !stopping) ws.send(ev.data);
    };
    ws.onopen = () => {
      setSpelling(spell.checked);
      setPunctuation(punct.checked);
      status.textContent = 'Klausomasi…';
      start.disabled = true; stop.disabled = false;
    };
    ws.onmessage = ev => {
      const msg = JSON.parse(ev.data);
      const follow = nearBottom();
      queueMicrotask(() => { if (follow) scrollToEnd(); });
      if (msg.type === 'partial') partial.textContent = msg.text;
      if (msg.type === 'final') {
        records.set(msg.seq, {raw: msg.text, punct: '', fixed: null, pieces: null});
        partial.textContent = ''; render();
      }
      if (msg.type === 'punctuation') {
        const r = records.get(msg.seq);
        if (r) {r.punct = msg.text; render();}
      }
      if (msg.type === 'spelling') {
        const r = records.get(msg.seq);
        if (r) {r.fixed = msg.text; r.pieces = msg.pieces; render();}
      }
      if (msg.type === 'punctuation_error') status.textContent = 'Skyrybos klaida – originalas išsaugotas';
      if (msg.type === 'error') status.textContent = msg.message;
      if (msg.type === 'stopped') {
        ws.close(); status.textContent = 'Sustabdyta'; cleanup();
      }
    };
    ws.onerror = () => {status.textContent = 'Ryšio klaida';};
    ws.onclose = () => { if (!stopping) {status.textContent = 'Ryšys nutrūko'; cleanup();} };
  } catch (e) { status.textContent = e.message; await cleanup(); }
};
stop.onclick = async () => {
  if (stopping) return;
  stopping = true;
  node.port.onmessage = ev => {if (ws.readyState === WebSocket.OPEN) ws.send(ev.data);};
  node.port.postMessage('flush');
  source.disconnect();
  await new Promise(r => setTimeout(r, 150));
  if (ws.readyState === WebSocket.OPEN) ws.send('stop');
  setTimeout(() => {
    if (ws?.readyState === WebSocket.OPEN) {ws.close();cleanup();}
  }, 30000);
};
</script></body></html>
